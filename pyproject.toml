[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minewaterwatch"
version = "0.1.0"
description = "Exploratory daily mine-water inflow change-point screening"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
minewaterwatch = "minewaterwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
